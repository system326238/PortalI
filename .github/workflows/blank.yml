name: Build SwiftUI App

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16 (iOS 18 SDK)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.0'

      - name: Build for iOS 18 Simulator
        working-directory: ./iOS
        run: |
          xcodebuild build \
            -target PortalInvasionApp \
            -sdk iphonesimulator
